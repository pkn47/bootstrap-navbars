<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Navbars</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <!-- Navbar 1: The Boardroom Kailua -->
  <div class="container-fluid px-0 boardroom-bar">
    <nav class="navbar navbar-expand-lg bg-gradient">
      <div class="container">
        <ul class="nav justify-content-start flex-fill">
          <li class="nav-item">
            <a class="navbar-brand" href="https://www.instagram.com/" aria-label="Instagram">
              <svg class="insta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="5"></rect>
                <circle cx="12" cy="12" r="4"></circle>
                <circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"></circle>
              </svg>
            </a>
          </li>
        </ul>

        <ul class="nav justify-content-center flex-fill">
          <li class="nav-item">
            <a href="#">
              <img class="logo" src="experience-bootstrap-navbars-board-room-logo.png" alt="The Boardroom logo">
            </a>
          </li>
        </ul>

        <ul class="nav justify-content-end flex-fill">
          <li class="nav-item">
            <button type="button" class="btn btn-dark">Menu</button>
          </li>
        </ul>
      </div>
    </nav>
  </div>

  <!-- Navbar 2: Morning Brew -->
  <div class="morning-brew">
    <nav class="navbar navbar-expand-lg bg-light">
      <div class="py-2 container">
        <div class="mx-auto navbar-nav">
          <img class="logo" src="experience-bootstrap-navbars-morning-brew-logo.png" alt="Morning Brew logo">
        </div>
      </div>
    </nav>

    <div class="navbar navbar-expand-lg bg-light sticky-top">
      <div class="container">
        <div class="mx-auto navbar-nav">
          <div class="nav-item border-1 border-top border-dark active border-3">Home</div>
          <div class="nav-item border-1 border-top border-dark">Order Online</div>
          <div class="nav-item border-1 border-top border-dark">Menus</div>
          <div class="nav-item border-1 border-top border-dark">Locations</div>
          <div class="nav-item border-1 border-top border-dark">About</div>
          <div class="nav-item border-1 border-top border-dark">Shop</div>
          <div class="nav-item border-1 border-top border-dark">Contact</div>
        </div>
      </div>
    </div>
  </div>

    <!-- Navbar 3: Buzz's -->
  <div class="container-fluid px-0 buzz-bar">
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <ul class="nav justify-content-start flex-fill">
          <li class="nav-item"><a class="nav-link" href="#">Lunch</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Dinner</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Drinks &amp; Pupu</a></li>
        </ul>
        <ul class="nav justify-content-center flex-fill">
          <li class="nav-item">
            <a href="#"><img class="logo" src="experience-bootstrap-navbars-buzzs-logo.png" alt="Buzz's logo"></a>
          </li>
        </ul>
        <ul class="nav justify-content-end flex-fill">
          <li class="nav-item"><a class="nav-link" href="#">About</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Location</a></li>
          <li class="nav-item">
            <a class="nav-link" href="#">Shop
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            </a>
          </li>
        </ul>
      </div>
    </nav>
  </div>
 
  <!-- Navbar 4: Aloha Beer Co. -->
  <div class="container-fluid px-0 aloha-bar">
    <nav class="navbar navbar-expand-lg bg-light">
      <div class="container">
        <ul class="nav justify-content-start flex-fill">
          <li class="nav-item">
            <a href="#"><img class="logo" src="experience-bootstrap-navbars-aloha-beer-logo.png" alt="Aloha Beer Co. logo"></a>
          </li>
        </ul>
        <ul class="nav justify-content-center flex-fill">
          <li class="nav-item"><a class="nav-link" href="#">Locations &amp; Menus</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Events</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Brewery</a></li>
          <li class="nav-item"><a class="nav-link shop" href="#">Shop</a></li>
        </ul>
        <ul class="nav justify-content-end flex-fill">
          <li class="nav-item"><a class="nav-link" href="#">Account</a></li>
          <li class="nav-item">
            <a class="nav-link" href="#">Search
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Cart
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            </a>
          </li>
        </ul>
      </div>
    </nav>
  </div>
 
  <!-- Navbar 5: Duke's Waikiki -->
  <div class="container-fluid px-0 dukes-bar">
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <ul class="nav justify-content-start flex-fill">
          <li class="nav-item">
            <a href="#"><img class="logo" src="experience-bootstrap-navbars-dukes-logo.png" alt="Duke's Waikiki logo"></a>
          </li>
        </ul>
        <ul class="nav justify-content-end flex-fill">
          <li class="nav-item"><a class="nav-link" href="#">Menus</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Duke</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Shop</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Join Our Team</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
          <li class="nav-item"><a class="nav-link order" href="#">Order Takeout &amp; Delivery</a></li>
        </ul>
      </div>
    </nav>
  </div>

</body>
</html>
